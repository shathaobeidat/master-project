<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event themes | Fiesta</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/root.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/themes.css">
</head>
<body>
  <div id="site-header"></div>
  <main id="main">
    <div class="page">
      <div class="page-hero">

      </div>
      <div class="themes-toolbar">
        <label>Event type<select id="f-event"></select></label>
        <span id="themes-count" role="status"></span>

      <div class="themes-grid" id="themes-grid"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/shared/data.js"></script>
  <script src="js/shared/icons.js"></script>
  <script src="js/shared/store.js"></script>
  <script src="js/shared/utils.js"></script>

</html>
